services:
  elbowpay:
    container_name: elbowpay
    build: .
    ports:
      - "5001:5001"

# mysql -u root --port 3307 --host localhost -p
  mysql:
    image: mysql:latest
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: elbowpay
      MYSQL_USER: root
      MYSQL_PASSWORD: password
    ports:
      - "3307:3307"

# psql -h localhost -p 5432 -U root -d mydatabase
  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"

# http://localhost:8081, username: admin, password: password
  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    environment:
      ME_CONFIG_MONGODB_SERVER: some-mongo
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password
    ports:
      - "8081:8081"

    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: some-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: elbowpay
    ports:
      - "27017:27017"

